<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Sesuatu Untukmu</title>
    <!-- Google Fonts Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background: radial-gradient(circle, #2a0845 0%, #12021c 60%, #000000 100%);
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            max-width: 600px;
            z-index: 2;
        }

        .subtitle-top {
            font-size: 0.95rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ff69b4;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.6);
            animation: fadeInDown 1s ease;
        }

        /* Styling Kotak Kado / Gambar Kado */
        .gift-box-wrapper {
            margin-bottom: 2rem;
            cursor: pointer;
            transition: transform 0.4s ease;
            animation: bounceGift 3s ease-in-out infinite;
        }

        .gift-box-wrapper:hover {
            transform: scale(1.05);
        }

        /* Ilustrasi Kado SVG Neon Halus */
        .gift-icon {
            width: 180px;
            height: 180px;
            filter: drop-shadow(0 0 25px rgba(255, 105, 180, 0.6));
            margin: 0 auto;
        }

        @keyframes bounceGift {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tombol Buka Hadiah */
        .open-btn {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            border: 1px solid #ff69b4;
            color: #fff;
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.6);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 1px;
        }

        .open-btn:hover {
            background: #fff;
            color: #d63384;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.9);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="subtitle-top">✨ Ada Sesuatu Untu Kamu Kebo Kecil ! ✨</div>
        
        <!-- Gambar / Animasi Kado Interaktif -->
        <div class="gift-box-wrapper" onclick="openGift()">
            <svg class="gift-icon" viewBox="0 0 24 24" fill="none" stroke="#ff69b4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <!-- Pita Kado Atas -->
                <path d="M12 8c-2-2-5-2-6 0s1 4 6 4 7-2 6-4-4-2-6 0z"/>
                <path d="M12 8v12"/>
                <!-- Kotak Kado -->
                <rect x="3" y="10" width="18" height="12" rx="2"/>
                <path d="M3 14h18"/>
            </svg>
        </div>

        <!-- Tombol Menuju Halaman Utama / Galeri -->
        <div>
            <a href="main.html" class="open-btn">✨ Klik untuk Membuka Hadiah ✨</a>
        </div>
    </div>

    <script>
        function openGift() {
            // Animasi kecil saat kado diklik, lalu pindah ke index.html
            document.querySelector('.gift-box-wrapper').style.transform = 'scale(1.2) rotate(5deg)';
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 300);
        }
    </script>
</body>
</html>
